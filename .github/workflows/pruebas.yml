name: Pruebas automatizadas

on:
  push:

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Ejecutar pruebas
        run: npm test